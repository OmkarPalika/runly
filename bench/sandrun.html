<!doctype html>
<meta charset="utf-8" />
<title>sandrun benchmark</title>
<script type="module">
  import { createRunner } from "/dist/index.js"
  const runner = createRunner({
    timeoutMs: 60000,
    runtimes: {
      sucrase: location.origin + "/dist/runtimes/sucrase.js",
      wasi: location.origin + "/dist/runtimes/wasi.js",
      xccjs: location.origin + "/dist/runtimes/xcc.js",
      mrubyjs: location.origin + "/dist/runtimes/mruby.js",
      go: location.origin + "/runtimes/go/",
      java: location.origin + "/runtimes/java/",
      clang: location.origin + "/runtimes/clang/",
    },
  })
  window.bench = async (language, code) => {
    const t = performance.now()
    const r = await runner.run({ language, code })
    return { ms: performance.now() - t, ok: r.exitCode === 0, out: r.stdout + r.stderr }
  }
</script>
