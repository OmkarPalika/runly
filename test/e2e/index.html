<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sandrun test page</title>
  </head>
  <body>
    <script type="module">
      import * as sandrun from "/dist/index.js"
      window.sandrun = sandrun
      // Runtimes built in this repo are served locally until they are published.
      window.runner = sandrun.createRunner({
        timeoutMs: 3000,
        onProgress: (p) => (window.progress ??= []).push(p),
        runtimes: {
          sucrase: location.origin + "/dist/runtimes/sucrase.js",
          wasi: location.origin + "/dist/runtimes/wasi.js",
          xccjs: location.origin + "/dist/runtimes/xcc.js",
          mrubyjs: location.origin + "/dist/runtimes/mruby.js",
          go: location.origin + "/runtimes/go/",
          java: location.origin + "/runtimes/java/",
          clang: location.origin + "/runtimes/clang/",
        },
      })
      window.secret = "host-only"
      document.cookie = "session=host-cookie"
    </script>
  </body>
</html>
