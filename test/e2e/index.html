<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>runbox test page</title>
  </head>
  <body>
    <script type="module">
      import * as runbox from "/dist/index.js"
      window.runbox = runbox
      // The bundled sucrase is served from this repo until the package is published.
      window.runner = runbox.createRunner({
        timeoutMs: 3000,
        runtimes: { sucrase: location.origin + "/dist/runtimes/sucrase.js" },
      })
      window.secret = "host-only"
      document.cookie = "session=host-cookie"
    </script>
  </body>
</html>
